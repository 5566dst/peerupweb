<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>peerup.cn 域名展示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --green: #00ff7a;
      --bg: #0a0f0c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--green);
      font-family: "JetBrains Mono", "Fira Code", monospace;
      overflow-x: hidden;
    }
    canvas#matrix {
      position: fixed; inset: 0;
      z-index: -2;
      opacity: 0.25;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        linear-gradient(rgba(0,255,122,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,122,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
      pointer-events: none;
    }
    .scanline {
      position: fixed; inset: 0;
      background: linear-gradient(transparent 50%, rgba(0,0,0,0.15) 50%);
      background-size: 100% 4px;
      z-index: 5;
      pointer-events: none;
      animation: scan 10s linear infinite;
    }
    @keyframes scan {
      from { background-position: 0 0; }
      to { background-position: 0 100%; }
    }
    .container {
      max-width: 880px;
      margin: 60px auto;
      padding: 30px;
      border: 1px solid var(--green);
      box-shadow: 0 0 20px rgba(0,255,122,0.15);
      position: relative;
    }
    .corner {
      position: absolute;
      width: 12px; height: 12px;
      border: 2px solid var(--green);
    }
    .corner.tl { top: -6px; left: -6px; border-right: none; border-bottom: none; }
    .corner.tr { top: -6px; right: -6px; border-left: none; border-bottom: none; }
    .corner.bl { bottom: -6px; left: -6px; border-right: none; border-top: none; }
    .corner.br { bottom: -6px; right: -6px; border-left: none; border-top: none; }

    h1 {
      font-size: 2rem;
      text-shadow: 0 0 8px var(--green);
      margin-bottom: 10px;
    }
    .domain {
      font-size: 3.2rem;
      font-weight: bold;
      margin: 20px 0;
      text-shadow: 0 0 14px var(--green);
    }
    .tagline {
      color: #7fffb0;
      margin-bottom: 30px;
    }
    .info {
      background: rgba(0,255,122,0.05);
      border-left: 3px solid var(--green);
      padding: 16px 20px;
      line-height: 1.8;
      margin: 30px 0;
    }
    .disclaimer {
      background: rgba(255,200,0,0.08);
      border: 1px solid rgba(255,200,0,0.3);
      padding: 14px 18px;
      font-size: 0.85rem;
      color: #ffd966;
      margin-top: 30px;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.8rem;
      color: #4caf7a;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.1em;
      background: var(--green);
      animation: blink 1s steps(2) infinite;
      vertical-align: bottom;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="scanline"></div>

<div class="container">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <h1>// DOMAIN://PEERUP.CN</h1>
  <div class="domain">peerup.cn</div>
  <div class="tagline">该域名正在寻求意向受让方，欢迎垂询<span class="cursor"></span></div>

  <div class="info">
    <p>• 状态：正常可转移</p>
    <p>• 后缀：.cn 中国顶级域名</p>
    <p>• 特点：简短易记，品牌关联性强</p>
    <p>• 交易：通过阿里云严选一键交易</p>
  </div>

  <div class="disclaimer">
    <strong>免责声明：</strong>本页面仅为域名信息展示，仅供参考。所有交易请通过阿里云严选域名交易平台进行，保障双方权益。
  </div>

  <footer>
    © 2026 peerup.cn 域名展示页
  </footer>
</div>

<script>
  // 矩阵雨（纯视觉，无数据）
  const c = document.getElementById("matrix");
  const ctx = c.getContext("2d");
  c.width = window.innerWidth;
  c.height = window.innerHeight;
  const chars = "01PEERUPCN$#";
  const fontSize = 14;
  const cols = Math.floor(c.width / fontSize);
  const drops = Array(cols).fill(1);
  function draw() {
    ctx.fillStyle = "rgba(10,15,12,0.05)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#00ff7a";
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > c.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 35);
  window.onresize = () => {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  };
</script>
</body>
</html>
